# ResilienceAI: the whole stack on one machine.
#
#   cp .env.example .env            # then change the passwords
#   docker compose up -d --build    # database, migrations, API, worker, web
#   docker compose --profile demo run --rm demo     # optional: load demo data (wipes the database)
#
# Web app: http://localhost:3000   API docs: http://localhost:8000/docs (bound to this machine only)

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  AUTH_MODE: ${AUTH_MODE:-dev}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
  ENTRA_ROLES_FROM_TOKEN: ${ENTRA_ROLES_FROM_TOKEN:-true}
  NOTIFY_MODE: ${NOTIFY_MODE:-simulated}
  GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
  GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
  GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
  GRAPH_SENDER: ${GRAPH_SENDER:-}
  TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
  DATABASE_URL: postgresql+psycopg://app_user:${APP_DB_PASSWORD}@db:5432/resilience
  WORKER_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/resilience
  EVIDENCE_STORE: ${EVIDENCE_STORE:-local}
  EVIDENCE_MAX_MB: ${EVIDENCE_MAX_MB:-25}
  EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
  EVIDENCE_S3_ENDPOINT: ${EVIDENCE_S3_ENDPOINT:-}
  EVIDENCE_S3_REGION: ${EVIDENCE_S3_REGION:-ap-south-1}
  EVIDENCE_S3_SSE: ${EVIDENCE_S3_SSE:-aws:kms}
  EVIDENCE_S3_KMS_KEY_ID: ${EVIDENCE_S3_KMS_KEY_ID:-}
  EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-0}
  EVIDENCE_RETENTION_MODE: ${EVIDENCE_RETENTION_MODE:-COMPLIANCE}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  SCANNER: ${SCANNER:-builtin}
  CLAMD_HOST: ${CLAMD_HOST:-clamav}
  CLAMD_PORT: ${CLAMD_PORT:-3310}
  AI_PROVIDER: ${AI_PROVIDER:-rules}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
  EVIDENCE_PRECHECK: ${EVIDENCE_PRECHECK:-on}
  EVIDENCE_LOOKBACK_DAYS: ${EVIDENCE_LOOKBACK_DAYS:-14}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:3000}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resilience"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./test-coordination
    image: resilienceai-api:local
    command: ["python", "-m", "scripts.migrate"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: resilienceai-api:local   # built by the migrate service
    pull_policy: never
    restart: unless-stopped
    environment: *api-env
    volumes:
      - evidence:/data/evidence
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: resilienceai-api:local   # built by the migrate service
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "scripts.worker"]
    environment: *api-env
    healthcheck:
      disable: true   # the image's check is the API's HTTP endpoint; the worker serves no HTTP
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    image: resilienceai-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }

  demo:
    image: resilienceai-api:local   # built by the migrate service
    pull_policy: never
    profiles: ["demo"]
    command: ["python", "-m", "scripts.demo"]
    environment: *api-env
    volumes:
      - evidence:/data/evidence
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ---- Optional: secure evidence storage on this machine (docker compose --profile secure-storage up -d) ----
  # MinIO stands in for the bank's S3-compatible store (Object Lock on); ClamAV scans uploads.
  minio:
    image: minio/minio:latest
    profiles: ["secure-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-resilienceai}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me-minio}
    volumes:
      - minio:/data
    ports:
      - "127.0.0.1:9001:9001"      # MinIO console, this machine only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    profiles: ["secure-storage"]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing --with-lock local/$${EVIDENCE_S3_BUCKET:-resilienceai-evidence} &&
        mc encrypt set sse-s3 local/$${EVIDENCE_S3_BUCKET:-resilienceai-evidence} || true
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-resilienceai}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-minio}
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-resilienceai-evidence}
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    profiles: ["secure-storage"]
    volumes:
      - clamav:/var/lib/clamav      # virus definitions, updated by freshclam inside the container
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s            # the first definitions download takes a few minutes
      retries: 5

volumes:
  pgdata:
  evidence:
  minio:
  clamav:
