name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resilience
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WORKER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resilience
      DATABASE_URL: postgresql+psycopg://app_user:app@localhost:5432/resilience
      EVIDENCE_DIR: ${{ runner.temp }}/evidence
    defaults:
      run:
        working-directory: test-coordination
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test-coordination/requirements*.txt
      - name: Create the restricted database login
        env: { PGPASSWORD: postgres }
        run: psql -h localhost -U postgres -d resilience -c "CREATE ROLE app_user LOGIN PASSWORD 'app'"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply cleanly, then report nothing pending
        run: |
          python -m scripts.migrate
          python -m scripts.migrate | tee /tmp/second.txt
          grep -q "nothing pending" /tmp/second.txt
      - name: Tests
        run: pytest -q

  web:
    name: Web lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i "s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=ci-$(openssl rand -hex 8)/" .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300 api worker web
      - name: Load demo data
        run: docker compose --profile demo run --rm demo
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://localhost:3000/workspace
          curl -fsS http://localhost:3000/api/v1/dev/directory | grep -q '"BANK"'
          docker compose run --rm migrate | grep -q "nothing pending"
      - name: Production guard refuses the development settings
        run: |
          if docker compose run --rm -e APP_ENV=production api python -c "import app.main"; then
            echo "API started in production with dev settings"; exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
